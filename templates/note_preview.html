<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Preview - Study Vault</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-shell">
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="/workspace">Workspace</a></li>
                <li><a href="/tasks">Queue</a></li>
                <li><a href="/journal">Journal</a></li>
                <li><a href="/vault">Vault</a></li>
                <li><a href="/settings">Settings</a></li>
            </ul>
        </nav>
    </aside>
    <main class="main-content">
        <h1>Note Preview</h1>
        <div class="note-preview">
            <img class="note-image" src="{{ url_for('static', filename='uploads/' ~ note.filename) }}" alt="{{ note.title }}">
            <div class="metadata">
                <h2>{{ note.title }}</h2>
                <p>Subject: {{ note.subject }}</p>
                <p>Uploaded: {{ note.uploaded_at.strftime('%Y-%m-%d') }}</p>
                <a class="btn" href="{{ url_for('download_note', note_id=note.id) }}">Download</a>
                <a class="btn secondary" href="/vault">Back to Vault</a>
            </div>
        </div>
    </main>
</body>
</html>
