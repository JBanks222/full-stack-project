<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Editor - Study Vault</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-shell">
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="/workspace">Workspace</a></li>
                <li><a href="/tasks">Queue</a></li>
                <li><a href="/journal">Journal</a></li>
                <li><a href="/vault">Vault</a></li>
                <li><a href="/settings">Settings</a></li>
            </ul>
        </nav>
    </aside>
    <main class="main-content">
        <h1>Post Editor</h1>
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        <form class="editor-form" method="POST" action="{{ url_for('post_editor') }}">
            <label>
                Title
                <input type="text" name="title" placeholder="Write a compelling title" required>
            </label>
            <label>
                Category
                <select name="category">
                    {% for category in categories %}
                        <option value="{{ category }}">{{ category }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>
                Tags
                <input type="text" name="tags" placeholder="separate tags with commas">
            </label>
            <label>
                Content
                <textarea name="content" rows="12" placeholder="Share study tips, experiences, or project insights" required></textarea>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" name="published" checked>
                Publish immediately
            </label>
            <div class="editor-actions">
                <button type="submit">Save Post</button>
            </div>
        </form>
    </main>
</body>
</html>
